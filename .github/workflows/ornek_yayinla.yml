name: Örnek videoyu yayına al

# ornek.yml'in ürettiği örnek videoyu (iş çıktısı "ornek-video", 14 gün saklanır) yeniden çizmeden normal üretim gibi
# kayda alır: GitHub Release (video.mp4, metadata.json, script.json), videos.json (onay_bekliyor), geçmiş ve Telegram
# onay mesajı. Mini Belgesel'in iki bölümü birlikte alınır (seri_id ve bölüm korunur: 1. bölüm onaylanınca 2. bölüm
# kendiliğinden zamanlanır). İki yoldan başlar:
#   - Telegram'da örnek mesajındaki "📥 Yayına al" düğmesi (kapı -> isle.yml -> bu iş, run_id + mesaj ile),
#   - elle: gh workflow run ornek_yayinla.yml -f run_id=<ornek.yml çalışma numarası>
# simdi=evet yalnız sahibi o videonun hemen paylaşılmasını istediyse kullanılır: video onaylanır ve paylaşım işi
# (onay.yml) başlar. Aksi hâlde Telegram'da onay bekler.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Örnek videoyu üreten ornek.yml çalışmasının numarası"
        required: true
      simdi:
        description: "evet: hemen onayla ve paylaş (sahibi istediyse) / hayir: Telegram'da onay bekler"
        required: false
        default: "hayir"
      mesaj:
        description: "Düğmesine basılan örnek mesajının numarası (Telegram düğmesi doldurur; elle boş bırak)"
        required: false

permissions:
  contents: write
  actions: write

# aynı örnek iki kez başlatılırsa (ör. iki bölümün düğmesine basıldı) ikinci iş birincinin kaydını görür ve durur
concurrency:
  group: ornek-yayinla
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: En güncel durumu al
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          git fetch -q origin main && git reset -q --hard origin/main
      - name: Çalışmanın örnek iş akışı olduğunu doğrula
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          MESAJ: ${{ inputs.mesaj }}
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run_id yalnız rakam olmalı"; exit 1;; esac
          case "$MESAJ" in *[!0-9]*) echo "::error::mesaj yalnız rakam olmalı"; exit 1;; esac
          # düğmeye örnek işi bitmeden (2. bölüm henüz gönderilirken) basılmış olabilir: iş bitene kadar 10 dk beklenir
          for i in $(seq 1 40); do
            read -r WF DURUM SONUC <<< "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
              --jq '.path + " " + .status + " " + (.conclusion // "-")')"
            [ "$DURUM" = "completed" ] && break
            echo "Örnek işi henüz bitmedi ($DURUM), bekleniyor…"; sleep 15
          done
          if [ "$WF" != ".github/workflows/ornek.yml" ] || [ "$SONUC" != "success" ]; then
            echo "::error::${RUN_ID} başarılı bir ornek.yml çalışması değil ($WF $DURUM $SONUC)"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ornek-video
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ornek
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Bölümleri ve etiketleri belirle (daha önce kayda alınanlar atlanır)
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          find ornek -type f | sort
          python -m shortgen.ornek_yayin hazirla ornek "$RUN_ID"
      - name: Zaten yayına alınmışsa bildir
        if: env.YENI == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ inputs.run_id }}
          MESAJ: ${{ inputs.mesaj }}
        run: python -m shortgen.ornek_yayin onizleme ornek zaten "$MESAJ"
      - name: Videoyu sakla (GitHub Release)
        if: env.YENI != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # uret.yml ile aynı dosyalar; yarım kalan işte Release zaten olabilir, yeniden kullanılır
          while IFS=$'\t' read -r T D Y; do
            [ "$Y" = "1" ] || continue
            if gh release view "$T" >/dev/null 2>&1; then echo "Release $T zaten var, yeniden kullanılıyor."; continue; fi
            TITLE=$(python -c "import json,sys;print(json.load(open(sys.argv[1], encoding='utf-8'))['title'])" "$D/metadata.json")
            gh release create "$T" "$D/video.mp4" "$D/metadata.json" "$D/script.json" \
              --title "$TITLE" --notes "Onay bekliyor (örnek videodan)" --prerelease
          done < ornek/plan.tsv
      - name: Geçmişe ekle ve Telegram'a onay mesajı gönder
        if: env.YENI != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ inputs.run_id }}
        run: python -m shortgen.ornek_yayin kaydet ornek "$RUN_ID"
      - name: Kaydı it
        # yarıda kalsa da gönderilen bölümün kaydı kaybolmasın: tekrar çalışınca kalan bölümden sürer
        if: always() && env.YENI != '0' && env.TAG != ''
        run: |
          python -m shortgen.state_sync "Yeni video (örnekten): $TAG"
      - name: Örnek mesajlarının düğmesini kaldır
        if: success() && env.YENI != '0'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ inputs.run_id }}
          MESAJ: ${{ inputs.mesaj }}
        run: python -m shortgen.ornek_yayin onizleme ornek alindi "$MESAJ"
      - name: Sahibi istediyse hemen onayla
        if: inputs.simdi == 'evet' && env.YENI != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # ilk bölüm onaylanır (Mini Belgesel'de 2. bölüm kendiliğinden zamanlanır).
          # Telegram çağrısı düşse bile onay kaydedilir ve paylaşım başlar; adım yine hata olarak görünür
          rc=0
          python3 - <<'PY' || rc=$?
          import os
          from shortgen import telegram_bot as tb
          tag, chat = os.environ["TAG"], os.environ["TELEGRAM_CHAT_ID"]
          v = tb._find(tb.load(tb.VIDEOS, []), tag)
          note = tb._approve(tag, "now", chat, v["telegram_message_id"])
          tb.api("sendMessage", data={"chat_id": chat, "text": f"{note}\n{v['title']}",
                                      "reply_to_message_id": v["telegram_message_id"]})
          PY
          python -m shortgen.state_sync "Örnek video onaylandı: $TAG"
          python -m shortgen.telegram_bot dispatch-if-due
          exit $rc
      - name: Hata bildir
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ inputs.run_id }}
          MESAJ: ${{ inputs.mesaj }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          # örnek mesajlarına '📥 Yayına al' düğmesini geri koy ki tekrar denenebilsin
          python -m shortgen.ornek_yayin onizleme ornek geri "$MESAJ" || true
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Örnek videoyu yayına alma işi yarım kaldı (iş çıktısı 14 gün saklanır). Düğmeye yeniden basmak güvenli: ${RUN_URL}" > /dev/null || true
