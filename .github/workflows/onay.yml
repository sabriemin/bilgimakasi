name: Telegram onaylarını işle

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  onay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Düğmeleri ve komutları oku
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN tanımlı değil, atlanıyor."; exit 0; fi
          python -m shortgen.telegram_bot poll | tee approved.txt
      # Platform yüklemeleri hesap bağlantıları yapıldıktan sonra buraya eklenecek.
      - name: Durumu kaydet
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          git add state/
          git commit -m "Onay durumları güncellendi" || exit 0
          git pull --rebase && git push
