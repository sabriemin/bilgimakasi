name: TikTok taslağını yeniden gönder

# TikTok gelen kutusuna gönderilen taslak telefona ulaşmadıysa (uygulama incelemeden geçene kadar videolar taslak gider)
# aynı videoyu TikTok'a yeniden yükler. Diğer platformlara dokunulmaz: yalnız TikTok kaydı "yeniden" diye işaretlenir ve
# paylaşım işi (onay.yml) yalnız TikTok'u yükler. Eski taslak sonradan gelirse ikisinden biri silinebilir.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Video etiketi (ör. short-20261105-061537). Boşsa TikTok'a taslak giden son video."
        required: false

permissions:
  contents: write
  actions: write

jobs:
  tekrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: En güncel durumu al
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          git fetch -q origin main && git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: TikTok'u yeniden yüklenecek diye işaretle
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, re, sys
          from pathlib import Path
          p = Path("state/videos.json")
          vids = json.loads(p.read_text(encoding="utf-8"))
          tag = (os.environ.get("TAG") or "").strip()
          if tag and not re.fullmatch(r"short-\d{8}-\d{4,6}", tag):
              sys.exit(f"::error::Geçersiz etiket: {tag!r}")
          if not tag:
              cands = [v for v in vids if ((v.get("platforms") or {}).get("tiktok") or {}).get("draft")]
              if not cands:
                  sys.exit("::error::TikTok'a taslak giden video yok")
              tag = cands[-1]["tag"]
          v = next((x for x in vids if x["tag"] == tag), None)
          if not v:
              sys.exit(f"::error::Video bulunamadı: {tag}")
          if v.get("status") in ("zamanlandi", "yayinlaniyor"):
              sys.exit(f"::error::Video şu an paylaşım sırasında ({v['status']}); bitince yeniden dene")
          old = (v.get("platforms") or {}).pop("tiktok", None)
          if old:
              v.setdefault("tiktok_onceki", []).append(old)
          v["status"] = "zamanlandi"
          v["publish_at"] = dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")
          v["schedule"] = None
          p.write_text(json.dumps(vids, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Yeniden gönderilecek:", tag, "|", v.get("title"))
          PY
          python -m shortgen.state_sync "TikTok taslağı yeniden gönderilecek"
      - name: Paylaşım işini başlat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m shortgen.telegram_bot dispatch-if-due
