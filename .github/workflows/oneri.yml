name: Gündemden konu öner

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  oneri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code kur
        run: npm install -g @anthropic-ai/claude-code
      - name: Gündemi tara ve Telegram'a gönder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m shortgen.trends notify
      - name: Kaydet
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Gündem önerileri"
      - name: Kapı yoksa butonları 30 dakika dinle
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Kapı (webhook) kuruluyken düğmeleri kapı, saatli paylaşımları kapının zamanlayıcısı karşılar; 30 dakikalık
          # dinleme yalnız Actions dakikası harcar. Dinleme yalnız kapı kurulu değilse başlatılır.
          KAPI=$(python3 -c "import json,os,urllib.request as u; print(json.load(u.urlopen('https://api.telegram.org/bot' + os.environ['TELEGRAM_BOT_TOKEN'] + '/getWebhookInfo', timeout=20))['result'].get('url', ''))" 2>/dev/null || echo "?")
          if [ -z "$KAPI" ]; then gh workflow run onay.yml -f dakika=30 || true; else echo "Kapı kurulu (ya da denetlenemedi): dinleme başlatılmadı."; fi
