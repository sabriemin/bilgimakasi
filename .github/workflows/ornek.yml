name: Örnek video (yayınlanmaz)

# Yeni bir şablonu göstermek için sesli örnek video üretir. Telegram'a göz atmak için gider: onay düğmesi yoktur,
# videos.json'a / geçmişe kaydedilmez, hiçbir platformda paylaşılmaz, depoya hiçbir şey yazılmaz.
# Mesajdaki "📥 Yayına al" düğmesi ornek_yayinla.yml'i başlatır: bu işin çıktısı ("ornek-video", 14 gün) yeniden
# çizilmeden normal onay akışına alınır (Mini Belgesel'de iki bölüm birlikte).
on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: "Hazır senaryo dosyası (depodaki yol, ör. demo/kart/ornek_cin_seddi.json). Boşsa konu kullanılır."
        required: false
      konu:
        description: "Senaryo yoksa Claude'un yazacağı konu (Mini Belgesel için kalip ya da sablon belgesel: iki bölüm, iki video)"
        required: false
      sablon:
        description: "Şablon (ör. kart, nasil, uretim, isemri, ajanda, dosya, kitap, cizgi, belgesel). cizgi: Karar Senin çizgi roman; sahnelerinde cizgi tarifi olan senaryo (ör. demo/cizgi/kuzey_1.json) her zaman cizgi şablonuyla çizilir. nasil, uretim, isemri (Nasıl Üretiliyor? iş emri), ajanda (Ya Sen Olsaydın?), dosya (Efsane mi, Gerçek mi?), kitap ve belgesel (Mini Belgesel, iki bölüm) şablonlarında konuyla üretim şablonun kalıbıyla (nasil / uretim / olsaydin / efsane / kitap / belgesel) yazılır."
        required: false
        default: "kart"
      kalip:
        description: "İsteğe bağlı sabit anlatım kalıbı, yalnız konuyla üretimde (ör. efsane, nasil, uretim, olsaydin, kitap, belgesel). nasil, uretim, isemri (uretim), ajanda (olsaydin), dosya (efsane), kitap ve belgesel şablonları yalnız kendi kalıbıyla; başka kalıp verilirse üretim durur."
        required: false
      not:
        description: "Telegram mesajına eklenecek kısa not"
        required: false

permissions:
  contents: read

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Girdiler
        env:
          SENARYO: ${{ github.event.inputs.senaryo }}
          KONU: ${{ github.event.inputs.konu }}
          KALIP: ${{ github.event.inputs.kalip }}
        run: |
          if [ -z "$SENARYO" ] && [ -z "$KONU" ]; then
            echo "::error::Senaryo dosyası ya da konu verilmeli (konusuz üretim gündem/sıra/bekleyen senaryoya dokunurdu)."; exit 1
          fi
          # kalıp yalnız ortam değişkeniyle geçer; tam listeyi pipeline (--structure seçenekleri) denetler
          if ! [[ "$KALIP" =~ ^[a-z]{0,20}$ ]]; then
            echo "::error::Kalıp yalnız küçük harflerden oluşur (ör. nasil, uretim, olsaydin)."; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg kur
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2
      - run: pip install -r requirements.txt "rembg[cpu]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code kur
        # hazır senaryoda da gerekir: görsel denetimi ve yedek çizimler Claude ile yapılır. npm bazen takılıyor: 4 dk sınır, 3 deneme
        timeout-minutes: 14
        run: for i in 1 2 3; do timeout 240 npm install -g @anthropic-ai/claude-code && break; echo "npm yeniden deneniyor ($i)"; sleep 5; done; claude --version
      - name: Arka plan silme modelini önbellekle
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1
      - name: Örnek videoyu üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'BPOQsosga3cXhsJivIRc' }}
          MUSIC_FILE: ${{ vars.MUSIC_FILE }}
          SENARYO: ${{ github.event.inputs.senaryo }}
          KONU: ${{ github.event.inputs.konu }}
          SABLON: ${{ github.event.inputs.sablon }}
          KALIP: ${{ github.event.inputs.kalip }}
          SERIES: "0"  # örnek bir seri başlatmasın
          AUTO_TREND: "0"
        run: |
          ARGS=(--out "$RUNNER_TEMP/ornek")
          [ -n "$SABLON" ] && ARGS+=(--template "$SABLON")
          if [ -n "$SENARYO" ]; then ARGS+=(--script "$SENARYO"); else ARGS+=("--topic=$KONU"); fi
          # hazır senaryoda kalıp senaryonun kendisinden gelir; konuyla üretimde sabitlenir
          [ -z "$SENARYO" ] && [ -n "$KALIP" ] && ARGS+=(--structure "$KALIP")
          python -m shortgen.pipeline "${ARGS[@]}"
          echo "OUT_DIR=$(ls -td "$RUNNER_TEMP"/ornek/*/ | head -1)" >> "$GITHUB_ENV"
          # Mini Belgesel iki klasör (iki bölüm) üretir: hepsi uretilen.txt'de
          [ -s "$RUNNER_TEMP/ornek/uretilen.txt" ] || ls -td "$RUNNER_TEMP"/ornek/*/ | head -1 > "$RUNNER_TEMP/ornek/uretilen.txt"
      - name: Telegram'a gönder (onaysız, kayıtsız; 📥 Yayına al düğmesiyle)
        # iş çıktısından önce: mesaj numarası (telegram.json) çıktıya girer ki yayına alınınca düğme kaldırılabilsin
        env:
          ORNEK_RUN_ID: ${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOT: ${{ github.event.inputs.not }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram tanımlı değil, gönderim atlandı."; exit 0; fi
          while read -r D; do python -m shortgen.telegram_bot preview "$D" "$NOT"; done < "$RUNNER_TEMP/ornek/uretilen.txt"
      - name: Videoyu iş çıktısı olarak sakla
        # Telegram adımı düşse de video saklanır (indirip izlemek için)
        if: always() && env.OUT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ornek-video
          path: |
            ${{ runner.temp }}/ornek/*/video.mp4
            ${{ runner.temp }}/ornek/*/metadata.json
            ${{ runner.temp }}/ornek/*/script.json
            ${{ runner.temp }}/ornek/*/telegram.json
          retention-days: 14
