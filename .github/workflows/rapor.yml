name: İstatistik ölçümü (sessiz)

# Telegram'a rapor göndermez (Sabri raporu yalnız /rapor ya da panelden istiyor, 2026-11-05): ölçümü panel grafikleri
# için state/stats_gecmis.jsonl'e ekler ve yeni yorumlara cevap taslağı hazırlar. Rapor /rapor ile isle.yml'de gönderilir.

on:
  schedule:
    - cron: "0 7 * * *"    # 10:00 Türkiye
    - cron: "0 18 * * *"   # 21:00 Türkiye
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rapor

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ölç ve panel geçmişine kaydet (Telegram'a rapor gitmez)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m shortgen.stats kaydet
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code kur
        run: npm install -g @anthropic-ai/claude-code
      - name: Yeni yorumlara cevap taslağı
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m shortgen.comments check
      - name: Kaydet
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "İstatistik raporu"
