name: Telegram olayını işle

# Cloudflare kapısı (cloudflare/worker.js) her düğme basışını / komutu buraya iletir.
# Dinleme işi yerine olay başına ~1 dakikalık çalışma: hızlı ve Actions dakikası açısından ucuz.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Telegram update JSON (kapı doldurur)"
        required: true

permissions:
  contents: write
  actions: write

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: En güncel durumu al
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          git fetch -q origin main && git reset -q --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt
      - run: pip install -r requirements-bot.txt
      - name: Olayı işle
        env:
          UPDATE: ${{ inputs.update }}
          TG_WEBHOOK: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'PUBLIC_TO_EVERYONE' }}
          TIKTOK_HANDLE: ${{ vars.TIKTOK_HANDLE || 'bilgimakasi' }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          BEST_TIMES: ${{ vars.BEST_TIMES }}
        run: python -m shortgen.telegram_bot handle-update
      - name: Durumu kaydet
        if: always()
        run: python -m shortgen.state_sync "Telegram olayı işlendi"
      - name: Şimdi paylaşılacak varsa paylaşım işini başlat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m shortgen.telegram_bot dispatch-if-due
      - name: Hata bildir
        if: failure()
        env:
          UPDATE: ${{ inputs.update }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # kapı düğmeyi '⏳ İşleniyor' yapmıştı: basılan klavyeyi geri koy ki tekrar denenebilsin
          python3 - <<'PY' || true
          import json, os, urllib.request, urllib.parse
          u = json.loads(os.environ.get("UPDATE") or "{}")
          m = (u.get("callback_query") or {}).get("message")
          if m:
              data = urllib.parse.urlencode({"chat_id": m["chat"]["id"], "message_id": m["message_id"],
                                             "reply_markup": json.dumps(m.get("reply_markup") or {"inline_keyboard": []})}).encode()
              urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/editMessageReplyMarkup", data, timeout=20)
          p = u.get("panel")
          if isinstance(p, dict) and p.get("tag"):  # panelden gelen işlemde düğmeleri videonun durumuna göre geri koy
              from shortgen.telegram_bot import _restore_kb
              _restore_kb(p["tag"], os.environ["TELEGRAM_CHAT_ID"])
          PY
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Son işlem sırasında hata oluştu. Ayrıntı: ${RUN_URL}" > /dev/null
