name: Short video üret

on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 Türkiye saati
    - cron: "0 15 * * *"   # 18:00 Türkiye saati
  workflow_dispatch:
    inputs:
      topic:
        description: "İsteğe bağlı konu önerisi"
        required: false
      template:
        description: "İsteğe bağlı şablon (kolaj, gece, doga)"
        required: false
      kalip:
        description: "İsteğe bağlı sabit anlatım kalıbı (öneri serisinden: efsane, nasil)"
        required: false

permissions:
  contents: write
  actions: write

# Onay dinleme oturumu (group: state) 30 dk sürebildiği için üretim ayrı grupta çalışır;
# durum dosyaları shortgen.state_sync ile içerik düzeyinde birleştirilir.
# Üretimler paralel çalışabilir: GitHub bir grupta yalnız 1 bekleyen iş tuttuğu için grup kullanmak
# art arda gelen üretim isteklerinden birini iptal ediyordu. Durum dosyaları state_sync ile birleştirilir.

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Anahtarlar tanımlı mı?
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Üretim aylık API kredisinden (ANTHROPIC_API_KEY) yürür; anahtar yoksa abonelik jetonuna düşer.
          if [ -z "$K" ] && [ -z "$T" ]; then echo "::error::ANTHROPIC_API_KEY (ya da CLAUDE_CODE_OAUTH_TOKEN) gizli anahtarı tanımlı değil."; exit 1; fi
          [ -n "$K" ] || echo "::warning::ANTHROPIC_API_KEY yok, abonelik jetonu kullanılacak."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2
      - run: pip install -r requirements.txt "rembg[cpu]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code kur
        run: npm install -g @anthropic-ai/claude-code
      - name: Arka plan silme modelini önbellekle
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1
      - name: Video üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'BPOQsosga3cXhsJivIRc' }}
          MUSIC_FILE: ${{ vars.MUSIC_FILE }}
          TOPIC: ${{ github.event.inputs.topic }}
          TEMPLATE: ${{ github.event.inputs.template }}
          KALIP: ${{ github.event.inputs.kalip }}
        run: |
          ARGS=()
          [ -n "$TOPIC" ] && ARGS+=(--topic "$TOPIC")
          [ -n "$TEMPLATE" ] && ARGS+=(--template "$TEMPLATE")
          # kalıp yalnız ortam değişkeniyle geçer; geçerliliğini pipeline (--structure seçenekleri) denetler
          [ -n "$KALIP" ] && ARGS+=(--structure "$KALIP")
          python -m shortgen.pipeline "${ARGS[@]}"
          echo "OUT_DIR=$(ls -td output/*/ | head -1)" >> "$GITHUB_ENV"
          echo "TAG=short-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"
      - name: Videoyu sakla (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(python -c "import json;print(json.load(open('${OUT_DIR}metadata.json'))['title'])")
          gh release create "$TAG" "${OUT_DIR}video.mp4" "${OUT_DIR}metadata.json" "${OUT_DIR}script.json" \
            --title "$TITLE" --notes "Onay bekliyor" --prerelease
      - name: Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram tanımlı değil, bildirim atlandı."; exit 0; fi
          python -m shortgen.telegram_bot notify "$OUT_DIR" "$TAG"
          # videoyu hemen kaydet: Telegram'da düğmeye basıldığında işle.yml onu bulabilsin
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yeni video: $TAG"
      - name: Yeni yorumlara cevap taslağı
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m shortgen.comments check
      - name: Geçmişi kaydet
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yeni video: $TAG"
      - name: Onay düğmelerini 30 dakika anında dinle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run onay.yml -f dakika=30 || true
      - name: Hata olursa senaryoyu ve bütçe kaydını sakla
        if: failure()
        run: |
          S=$(ls -td output/*/ 2>/dev/null | head -1)
          [ -n "$S" ] && [ -f "${S}script.json" ] && cp "${S}script.json" state/bekleyen_senaryo.json
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yarım kalan üretim: senaryo saklandı"

