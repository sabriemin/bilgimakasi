name: Short video üret

on:
  schedule:
    - cron: "0 6 * * *"    # 09:00 Türkiye saati
    - cron: "0 15 * * *"   # 18:00 Türkiye saati
  workflow_dispatch:
    inputs:
      topic:
        description: "İsteğe bağlı konu önerisi"
        required: false
      template:
        description: "İsteğe bağlı şablon (ör. kolaj, gece, doga, kart, nasil, uretim, kitap, belgesel; nasil, uretim, kitap ve belgesel kendi kalıbıyla yazılır)"
        required: false
      kalip:
        description: "İsteğe bağlı sabit anlatım kalıbı (öneri serisinden: efsane, nasil, uretim, olsaydin, kitap, belgesel; belgesel iki bölümlük iki video üretir)"
        required: false
      yeniden:
        description: "Var olan bir videonun etiketi (ör. short-20261105-213747) ya da depodaki hazır senaryo (demo/....json): senaryo yeniden yazılmadan, verilen şablonla çizilir"
        required: false

permissions:
  contents: write
  actions: write

# Onay dinleme oturumu (group: state) 30 dk sürebildiği için üretim ayrı grupta çalışır;
# durum dosyaları shortgen.state_sync ile içerik düzeyinde birleştirilir.
# Üretimler paralel çalışabilir: GitHub bir grupta yalnız 1 bekleyen iş tuttuğu için grup kullanmak
# art arda gelen üretim isteklerinden birini iptal ediyordu. Durum dosyaları state_sync ile birleştirilir.

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Anahtarlar tanımlı mı?
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # Üretim aylık API kredisinden (ANTHROPIC_API_KEY) yürür; anahtar yoksa abonelik jetonuna düşer.
          if [ -z "$K" ] && [ -z "$T" ]; then echo "::error::ANTHROPIC_API_KEY (ya da CLAUDE_CODE_OAUTH_TOKEN) gizli anahtarı tanımlı değil."; exit 1; fi
          [ -n "$K" ] || echo "::warning::ANTHROPIC_API_KEY yok, abonelik jetonu kullanılacak."
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg kur
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libcairo2
      - run: pip install -r requirements.txt "rembg[cpu]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude Code kur
        # hazır senaryoda da gerekir: görsel denetimi ve yedek çizimler Claude ile yapılır. npm bazen takılıyor: 4 dk sınır, 3 deneme
        timeout-minutes: 14
        run: for i in 1 2 3; do timeout 240 npm install -g @anthropic-ai/claude-code && break; echo "npm yeniden deneniyor ($i)"; sleep 5; done; claude --version
      - name: Arka plan silme modelini önbellekle
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1
      - name: Video üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'BPOQsosga3cXhsJivIRc' }}
          MUSIC_FILE: ${{ vars.MUSIC_FILE }}
          TOPIC: ${{ github.event.inputs.topic }}
          TEMPLATE: ${{ github.event.inputs.template }}
          KALIP: ${{ github.event.inputs.kalip }}
          YENIDEN: ${{ github.event.inputs.yeniden }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=()
          [ -n "$TEMPLATE" ] && ARGS+=(--template "$TEMPLATE")
          if [[ "$YENIDEN" =~ ^demo/[A-Za-z0-9_/-]+\.json$ ]] && [ -f "$YENIDEN" ]; then
            # depodaki hazır senaryo (ör. onaylanmış örnek) yayın akışına alınır
            ARGS+=(--script "$YENIDEN")
          elif [ -n "$YENIDEN" ]; then
            # var olan videonun senaryosu (Release'teki script.json) Claude'a yeniden yazdırılmadan yeni şablonla çizilir
            if ! [[ "$YENIDEN" =~ ^short-[0-9]{8}-[0-9]{6}$ ]]; then
              echo "::error::Etiket short-YYYYMMDD-HHMMSS biçiminde olmalı."; exit 1
            fi
            gh release download "$YENIDEN" -p script.json -D "$RUNNER_TEMP/yeniden" --clobber
            ARGS+=(--script "$RUNNER_TEMP/yeniden/script.json")
          else
            [ -n "$TOPIC" ] && ARGS+=(--topic "$TOPIC")
            # kalıp yalnız ortam değişkeniyle geçer; geçerliliğini pipeline (--structure seçenekleri) denetler
            [ -n "$KALIP" ] && ARGS+=(--structure "$KALIP")
          fi
          python -m shortgen.pipeline "${ARGS[@]}"
          # üretilen video klasörleri (Mini Belgesel: iki bölüm, iki klasör); her biri ayrı etiketle (1 sn arayla) saklanır
          if [ -s output/uretilen.txt ]; then mapfile -t DIRS < output/uretilen.txt; else DIRS=("$(ls -td output/*/ | head -1)"); fi
          BASE=$(date -u +%s); : > output/etiketler.tsv
          for i in "${!DIRS[@]}"; do
            echo "short-$(date -u -d "@$((BASE + i))" +%Y%m%d-%H%M%S) ${DIRS[$i]}" >> output/etiketler.tsv
          done
          echo "OUT_DIR=${DIRS[0]}" >> "$GITHUB_ENV"
          echo "TAG=$(head -1 output/etiketler.tsv | cut -d' ' -f1)" >> "$GITHUB_ENV"
          # 2. bölümün etiketi birinciyle çakışmasın: sonraki iş en az bir saniye sonra başlasın
          sleep "${#DIRS[@]}"
      - name: Videoyu sakla (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r T D; do
            TITLE=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['title'])" "${D}metadata.json")
            gh release create "$T" "${D}video.mp4" "${D}metadata.json" "${D}script.json" \
              --title "$TITLE" --notes "Onay bekliyor" --prerelease
          done < output/etiketler.tsv
      - name: Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram tanımlı değil, bildirim atlandı."; exit 0; fi
          # Mini Belgesel'in iki bölümü sırayla gönderilir (videos.json'da seri_id ve bölüm numarasıyla bağlı)
          while read -r T D; do python -m shortgen.telegram_bot notify "$D" "$T"; done < output/etiketler.tsv
          # videoyu hemen kaydet: Telegram'da düğmeye basıldığında işle.yml onu bulabilsin
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yeni video: $TAG"
      - name: Yeni yorumlara cevap taslağı
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD || '90' }}
          CLAUDE_BUDGET_RESET_DAY: ${{ vars.CLAUDE_BUDGET_RESET_DAY || '24' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m shortgen.comments check
      - name: Geçmişi kaydet
        run: |
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yeni video: $TAG"
      - name: Kapı yoksa onay düğmelerini 30 dakika dinle
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Kapı (webhook) kuruluyken düğmeleri kapı, saatli paylaşımları kapının zamanlayıcısı karşılar; 30 dakikalık
          # dinleme yalnız Actions dakikası harcar. Dinleme yalnız kapı kurulu değilse başlatılır.
          KAPI=$(python3 -c "import json,os,urllib.request as u; print(json.load(u.urlopen('https://api.telegram.org/bot' + os.environ['TELEGRAM_BOT_TOKEN'] + '/getWebhookInfo', timeout=20))['result'].get('url', ''))" 2>/dev/null || echo "?")
          if [ -z "$KAPI" ]; then gh workflow run onay.yml -f dakika=30 || true; else echo "Kapı kurulu (ya da denetlenemedi): dinleme başlatılmadı."; fi
      - name: Telif kuralı yüzünden durduysa Telegram'a yaz
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Bir Kitap Bir Dakika: kamu malı olmayan kitabın senaryosunda alıntı kaldıysa pipeline kısa bir not bırakır
          [ -f output/telif_durdu.txt ] || exit 0
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram tanımlı değil, bildirim atlandı."; exit 0; fi
          python -m shortgen.telegram_bot durdu output/telif_durdu.txt || echo "Telegram bildirimi gönderilemedi."
      - name: Hata olursa senaryoyu ve bütçe kaydını sakla
        if: failure()
        run: |
          S=$(ls -td output/*/ 2>/dev/null | head -1)
          # iki bölümlük Mini Belgesel'de bölüm senaryosu yerine iki bölümü birlikte tutan tam senaryo saklanır
          if [ -n "$S" ] && [ -f "${S}tam_senaryo.json" ]; then cp "${S}tam_senaryo.json" state/bekleyen_senaryo.json
          elif [ -n "$S" ] && [ -f "${S}script.json" ]; then cp "${S}script.json" state/bekleyen_senaryo.json; fi
          git config user.name "shortgen-bot"
          git config user.email "shortgen-bot@users.noreply.github.com"
          python -m shortgen.state_sync "Yarım kalan üretim: senaryo saklandı"

