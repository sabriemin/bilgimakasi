name: Telegram kapısını kur (Cloudflare)

# Cloudflare Worker'ı yükler, gizli değerlerini koyar ve Telegram webhook'unu ona bağlar.
# islem=kaldir: webhook'u siler, bot eski dinleme (getUpdates) yöntemine döner.
# Aynı worker /panel adresinde yönetim panelini de sunar (giriş: Telegram'da /panel).
# Kapı internete açık olduğu için ayrı, dar yetkili bir anahtar kullanır: KAPI_PAT (fine-grained, yalnız bilgimakasi;
# Actions: Read and write, Contents: Read-only, Metadata: Read-only). GH_SECRETS_PAT'in Secrets yazma ve site deposu
# (sabriemin.github.io) yazma izni kapıya verilmez; KAPI_PAT yoksa geçici olarak ona düşülür ve uyarı yazılır.
on:
  workflow_dispatch:
    inputs:
      islem:
        description: "kur veya kaldir"
        default: "kur"

permissions:
  contents: read

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT: ${{ secrets.KAPI_PAT || secrets.GH_SECRETS_PAT }}
      PAT_ADI: ${{ secrets.KAPI_PAT != '' && 'KAPI_PAT' || 'GH_SECRETS_PAT' }}
      NAME: bilgimakasi-kapi
    steps:
      - uses: actions/checkout@v4
      - name: Kaldır
        if: inputs.islem == 'kaldir'
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" | head -c 300; echo
      - name: GitHub anahtarının iş başlatma iznini dene
        if: inputs.islem != 'kaldir'
        run: |
          if [ "$PAT_ADI" != "KAPI_PAT" ]; then
            echo "::warning::KAPI_PAT tanımlı değil; kapı geçici olarak GH_SECRETS_PAT ile kuruluyor. O anahtarın Secrets ve site deposu yazma izni de var; internete açık kapıya verilmemeli. Yalnız bilgimakasi deposu için 'Actions: Read and write' + 'Contents: Read-only' izinli yeni bir fine-grained token oluşturup KAPI_PAT adıyla Secrets'a ekle ve bu işi yeniden çalıştır."
          fi
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/isle.yml/dispatches" \
            -d '{"ref":"main","inputs":{"update":"{}"}}')
          echo "isle.yml dispatch: $code"; cat /tmp/r.txt; echo
          if [ "$code" != "204" ]; then
            echo "::error::${PAT_ADI} ile iş başlatılamıyor. Fine-grained token'a (KAPI_PAT) bilgimakasi deposu için 'Actions: Read and write' izni eklenmeli."
            exit 1
          fi
      - name: GitHub anahtarının depo okuma iznini dene (panel)
        if: inputs.islem != 'kaldir'
        run: |
          # Panel, durum dosyalarını ve videoları bu anahtarla okur. İzin yoksa kurulum sürer, yalnız panel açılmaz.
          code=$(curl -s -o /tmp/c.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/state/videos.json?ref=main" || true)
          echo "state/videos.json okuma: $code"
          if [ "$code" != "200" ]; then
            head -c 300 /tmp/c.txt 2>/dev/null || true; echo
            echo "::error::Panel için ${PAT_ADI} depoyu okuyamıyor (HTTP $code). Fine-grained token'a (KAPI_PAT) bilgimakasi deposu için 'Contents: Read-only' izni eklenmeli. Bot düğmeleri yine çalışır; panel bu izin eklenene kadar veri gösteremez."
            echo "PANEL_OKUMA=yok" >> "$GITHUB_ENV"
          fi
      - name: Gizli kapı anahtarı üret
        if: inputs.islem != 'kaldir'
        run: |
          [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID eksik"; exit 1; }
          SECRET=$(openssl rand -hex 24)
          echo "::add-mask::$SECRET"
          echo "WEBHOOK_SECRET=$SECRET" >> "$GITHUB_ENV"
          # panel giriş bağlantılarını ve oturum çerezini imzalar; her kurulumda yenilenir (açık oturumlar kapanır)
          PANEL=$(openssl rand -hex 32)
          echo "::add-mask::$PANEL"
          echo "PANEL_SECRET=$PANEL" >> "$GITHUB_ENV"
      - name: Worker'ı yükle
        if: inputs.islem != 'kaldir'
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}"
          python3 - <<'PY' > /tmp/meta.json
          import json, os
          b = lambda n, v: {"type": "secret_text", "name": n, "text": v}
          print(json.dumps({"main_module": "worker.js", "compatibility_date": "2024-11-01", "bindings": [
              b("TELEGRAM_BOT_TOKEN", os.environ["TELEGRAM_BOT_TOKEN"]), b("CHAT_ID", os.environ["TELEGRAM_CHAT_ID"]),
              b("GH_PAT", os.environ["GH_PAT"]), b("WEBHOOK_SECRET", os.environ["WEBHOOK_SECRET"]),
              b("PANEL_SECRET", os.environ["PANEL_SECRET"]),
              {"type": "plain_text", "name": "REPO", "text": os.environ["GITHUB_REPOSITORY"]}]}))
          PY
          r=$(curl -s -X PUT "${API}/workers/scripts/${NAME}" -H "Authorization: Bearer ${CF_TOKEN}" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@cloudflare/worker.js;type=application/javascript+module" \
            -F "panel.js=@cloudflare/panel.js;type=application/javascript+module" \
            -F "panel_ui.js=@cloudflare/panel_ui.js;type=application/javascript+module")
          echo "$r" | python3 -c "import json,sys;d=json.load(sys.stdin);print('yükleme:', d['success'], d.get('errors'))"
          echo "$r" | python3 -c "import json,sys;sys.exit(0 if json.load(sys.stdin)['success'] else 1)"
          # workers.dev alt alan adı (yoksa oluştur) ve bu worker için aç
          sub=$(curl -s "${API}/workers/subdomain" -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "import json,sys;print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')")
          if [ -z "$sub" ]; then
            curl -s -X PUT "${API}/workers/subdomain" -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" -d '{"subdomain":"bilgimakasi"}' | head -c 400; echo
            sub=bilgimakasi
          fi
          curl -s -X POST "${API}/workers/scripts/${NAME}/subdomain" -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" -d '{"enabled":true,"previews_enabled":false}' | head -c 300; echo
          echo "URL=https://${NAME}.${sub}.workers.dev" >> "$GITHUB_ENV"
      - name: Kapıyı dene ve webhook'u bağla
        if: inputs.islem != 'kaldir'
        run: |
          set -e
          # yeni hesaplarda workers.dev adresinin açılması birkaç dakika sürebilir
          for i in $(seq 30); do
            body=$(curl -sS -m 10 "$URL" 2>&1 || true); echo "kapı ($i): ${body:0:160}"
            echo "$body" | grep -q "çalışıyor" && break; sleep 10
          done
          echo "$body" | grep -q "çalışıyor" || { echo "::error::Worker adresi yanıt vermiyor: $URL"; exit 1; }
          pc=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$URL/panel" || true)
          echo "panel sayfası: $pc ($URL/panel)"
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            --data-urlencode "max_connections=10" | head -c 300; echo
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" | python3 -c "import json,sys;d=json.load(sys.stdin)['result'];print('webhook:', bool(d.get('url')), 'bekleyen:', d.get('pending_update_count'), 'son hata:', d.get('last_error_message'))"
          MSG="✅ Bot artık 7/24 açık. Düğmelere anında cevap verir, işlemler 30-60 saniyede tamamlanır."$'\n\n'"🖥 Yönetim paneli için /panel yaz; gelen bağlantı 10 dakika geçerli ve tek kullanımlık, panel o tarayıcıda 30 gün açık kalır. Bu kurulumla önceki panel oturumları kapandı."
          if [ "${PANEL_OKUMA:-}" = "yok" ]; then
            MSG="$MSG"$'\n\n'"⚠️ Panel henüz veri gösteremez: kapının GitHub anahtarının (${PAT_ADI}) depoyu okuma izni yok. Bilgimakasi için 'Contents: Read-only' izinli KAPI_PAT eklenip bu kurulum yeniden çalıştırılınca açılır."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
