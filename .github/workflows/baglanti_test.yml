name: Platform bağlantısını test et

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "youtube, instagram, tiktok veya claude (API anahtarı testi)"
        required: true
        default: youtube

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pydantic
      - name: Test (yükleme yapılmaz)
        if: github.event.inputs.platform != 'claude'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID || '17841475131862440' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          P="${{ github.event.inputs.platform }}"
          case "$P" in
            instagram-yukleme:*) python -m shortgen.publish ig-upload-test "${P#instagram-yukleme:}" ;;
            yorum-izin) python -m shortgen.comments izin ;;
            instagram-durum:*) python -m shortgen.publish ig-status "${P#instagram-durum:}" ;;
            *) python -m shortgen.publish check "$P" ;;
          esac
      - name: Claude Code kur
        if: github.event.inputs.platform == 'claude'
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude anahtarı testi (en küçük istek, anahtar yazdırılmaz)
        if: github.event.inputs.platform == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUTCE: ${{ vars.CLAUDE_MONTHLY_BUDGET_USD }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY tanımlı." || echo "::warning::ANTHROPIC_API_KEY tanımlı değil."
          echo "Depo bütçe değişkeni: ${BUTCE:-tanımsız (varsayılan 90 $)}"
          claude -p "Yalnız 'tamam' yaz." --model haiku --output-format stream-json --verbose --tools "" \
            --max-budget-usd 0.05 > cikti.jsonl 2> hata.txt || true
          python3 - <<'PY'
          import json
          ok = False
          for line in open("cikti.jsonl", encoding="utf-8"):
              try:
                  d = json.loads(line)
              except ValueError:
                  continue
              if d.get("type") == "system" and d.get("subtype") == "init":
                  print("Kimlik kaynağı:", d.get("apiKeySource"))
              if d.get("type") == "result":
                  ok = not d.get("is_error")
                  print("Sonuç:", "başarılı" if ok else "hata", "| maliyet $", d.get("total_cost_usd"),
                        "| yanıt:", str(d.get("result"))[:200])
          if not ok:
              print(open("hata.txt", encoding="utf-8").read()[-1500:])
              raise SystemExit(1)
          PY
